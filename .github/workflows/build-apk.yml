name: Build INDword APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          set -e
          if [ -f package.json ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then echo "ERROR: no .zip file found in the repository root"; exit 1; fi
            echo "Using $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            PKG=$(find _src -name package.json -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$PKG" ]; then echo "ERROR: package.json not found inside the zip"; exit 1; fi
            echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM=$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Apply INDword icons and splash screens
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp -r resources/res/. android/app/src/main/res/
          npx cap sync android

      - name: Compile APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x ./gradlew
          # dependency downloads occasionally fail on the runner (missing .pom errors): retry with a clean cache
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --refresh-dependencies -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000; then ok=1; break; fi
            echo "Attempt $i failed, retrying in 20s"; rm -rf ~/.gradle/caches/modules-2 ~/.gradle/caches/transforms-* ; sleep 20
          done
          [ "${ok:-0}" = 1 ]
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/INDword.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INDword-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/INDword.apk
          if-no-files-found: error
