name: Build INDword APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          set -e
          if [ -f package.json ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then echo "ERROR: no .zip file found in the repository root"; exit 1; fi
            echo "Using $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            PKG=$(find _src -name package.json -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$PKG" ]; then echo "ERROR: package.json not found inside the zip"; exit 1; fi
            echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          SDKM=$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Apply INDword icons and splash screens
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp -r resources/res/. android/app/src/main/res/
          npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Use Maven Central mirror (fixes HTTP 429 Too Many Requests)
        run: |
          mkdir -p ~/.gradle/init.d
          echo "def r = { repo -> if (repo instanceof MavenArtifactRepository) { def u = repo.url.toString(); if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) { repo.url = 'https://maven-central.storage-download.googleapis.com/maven2/' } } }; gradle.settingsEvaluated { s -> s.pluginManagement.repositories.configureEach(r); s.dependencyResolutionManagement.repositories.configureEach(r) }; gradle.allprojects { p -> p.buildscript.repositories.configureEach(r); p.repositories.configureEach(r) }" > ~/.gradle/init.d/mirror.gradle
          cat ~/.gradle/init.d/mirror.gradle

      - name: Compile APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x ./gradlew
          ok=0
          for i in 1 2 3 4; do
            if ./gradlew assembleDebug --no-daemon \
                -Dorg.gradle.internal.http.connectionTimeout=60000 \
                -Dorg.gradle.internal.http.socketTimeout=60000 \
                -Dorg.gradle.internal.repository.max.retries=8 \
                -Dorg.gradle.internal.repository.initial.backoff=2000; then ok=1; break; fi
            echo "Attempt $i failed, retrying in $((i*30))s"; sleep $((i*30))
          done
          [ "$ok" = 1 ]
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/INDword.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INDword-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/INDword.apk
          if-no-files-found: error
